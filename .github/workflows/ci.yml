name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # ubuntu-latest's default JDK is 24+. Spark 3.5.9's Hadoop calls
      # Subject.getSubject while constructing JavaSparkContext, and JDK 24
      # throws UnsupportedOperationException from that method. Temurin 17 is
      # a Spark 3.5-supported runtime.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-spark.txt
      - name: Install CPU torch and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-spark.txt
      - name: Lint
        run: |
          ruff check src tests spark
          ruff format --check src tests spark
      - name: Test
        env:
          PYTHONPATH: src
        run: pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build serving image
        run: docker build -t shorts-recsys:ci .
