name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-spark.txt
      - name: Install CPU torch and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-spark.txt
      - name: Lint
        run: |
          ruff check src tests spark
          ruff format --check src tests spark
      - name: Test
        env:
          PYTHONPATH: src
        run: pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build serving image
        run: docker build -t shorts-recsys:ci .
