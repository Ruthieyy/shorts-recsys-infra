# Local short-video recommendation stack.
# Kafka is the official Apache image in KRaft mode (no ZooKeeper).
# Spark Structured Streaming and the Python feature worker are separate
# consumer groups on user_events. The API reads Redis features written by
# the Python worker; Spark writes a JSON snapshot of the same counters.

services:
  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    build: .
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --allowed-hosts "*"
      --cors-allowed-origins "*"
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  trainer:
    build: .
    command: ["python", "-m", "shorts_recsys.train"]
    environment:
      DATA_DIR: /app/data
      ARTIFACT_DIR: /app/artifacts
      RESULTS_PATH: /app/results/offline_metrics.json
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT: shorts-retrieval
      MLFLOW_REQUIRED: "1"
    volumes:
      - ./data:/app/data
      - artifacts:/app/artifacts
      - results:/app/results
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  feature-worker:
    build: .
    command: ["python", "-m", "shorts_recsys.feature_worker"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: user_events
      KAFKA_GROUP: shorts-feature-worker
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  replay:
    build: .
    command: ["python", "-m", "shorts_recsys.replay", "--rate", "4000"]
    environment:
      DATA_DIR: /app/data
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: user_events
    volumes:
      - ./data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      feature-worker:
        condition: service_started
    restart: "no"

  spark-stream:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    user: "0:0"
    entrypoint: ["/bin/bash", "/opt/job/spark-submit.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: user_events
      FEATURE_SNAPSHOT_PATH: /data/stream_features.jsonl
      CHECKPOINT_PATH: /data/spark_ckpt
      SPARK_LOG_LEVEL: WARN
    volumes:
      - ./spark/streaming_job.py:/opt/job/streaming_job.py:ro
      - ./docker/spark-submit.sh:/opt/job/spark-submit.sh:ro
      - ./docker/spark-jars:/opt/jars:ro
      - stream:/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: ["python", "-m", "shorts_recsys.serve"]
    environment:
      ARTIFACT_DIR: /app/artifacts
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      trainer:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

volumes:
  artifacts:
  results:
  mlflow:
  stream:
